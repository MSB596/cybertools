<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MSB Fisika AI</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Share Tech Mono', monospace; }
  body { background-color: #0a0000; color: #ffffff; padding: 20px; min-height: 100vh;
    background-image: linear-gradient(rgba(239,68,68,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(239,68,68,0.05) 1px, transparent 1px);
    background-size: 20px 20px; }
  .container { max-width: 700px; margin: auto; }
  h1 { text-align: center; font-size: 24px; color: #ef4444; text-shadow: 0 0 10px rgba(239,68,68,0.5); margin-bottom: 5px; }
  .subtitle { text-align: center; font-size: 11px; color: #884444; margin-bottom: 20px; letter-spacing: 1px;}
  .ai-box { background: rgba(20,0,0,0.8); border: 1px dashed #ef4444; padding: 20px; margin-bottom: 20px; text-align: center; }
  .ai-box p { font-size: 13px; color: #aa8888; margin-bottom: 10px; }
  input[type="file"] { display: none; }
  .btn-upload { background: #ef4444; color: #0a0000; padding: 12px 20px; cursor: pointer; font-weight: bold; font-size: 14px; border: none; display: inline-block;}
  .btn-upload:hover { background: #ff6666; }
  .ai-result { margin-top: 15px; font-size: 14px; color: #4ade80; text-align: left; white-space: pre-wrap; background: rgba(0,0,0,0.5); padding: 15px; border-left: 2px solid #4ade80; display: none;}
  .ai-result.error { border-left-color: #ff0000; color: #ff0000; }
  .tool-card { background: rgba(20,0,0,0.8); border: 1px solid #3f1d1d; padding: 20px; margin-bottom: 15px; border-left: 4px solid #ef4444; }
  .tool-card h2 { font-size: 14px; color: #ef4444; margin-bottom: 15px; border-bottom: 1px dashed #3f1d1d; padding-bottom: 8px;}
  .input-group { margin-bottom: 12px; }
  label { font-size: 11px; color: #aa8888; display: block; margin-bottom: 5px; text-transform: uppercase;}
  input[type="number"] { width: 100%; padding: 12px; background: transparent; border: 1px solid #3f1d1d; color: #fff; font-size: 14px; }
  input[type="number"]:focus { outline: none; border-color: #ef4444; background: #1f0808;}
  button.hitung { width: 100%; background: #ef4444; color: #0a0000; border: none; padding: 12px; cursor: pointer; font-weight: bold; margin-top: 8px; font-size: 14px; }
  button.hitung:hover { background: #ff6666; }
  .hasil { background: rgba(0,0,0,0.6); padding: 12px; border-left: 2px solid #4ade80; margin-top: 15px; font-size: 14px; color: #4ade80; word-break: break-all; }
  .hasil.error { border-left-color: #ff0000; color: #ff0000; }
</style>
</head>
<body>
<div class="container">
  <h1>MSB FISIKA AI</h1>
  <p class="subtitle">FISIKA CERDAS // CRIMSON EDITION</p>

  <div class="ai-box">
    <p>🤖 Upload Foto Soal, AI Langsung Jawab!</p>
    <label for="imageUpload" class="btn-upload">Pilih Gambar Soal</label>
    <input type="file" id="imageUpload" accept="image/*" onchange="tanyaAI(event)">
    <div class="ai-result" id="aiOutput"></div>
  </div>

  <div class="tool-card">
    <h2>01 // KECEPATAN SUATU BENDA (FISIKA)</h2>
    <div class="input-group"><label>Jarak (s) [m]</label><input type="number" id="v-s"></div>
    <div class="input-group"><label>Waktu (t) [s]</label><input type="number" id="v-t"></div>
    <button class="hitung" onclick="hitungV()">HITUNG</button>
    <div class="hasil" id="out-v">> Standby...</div>
  </div>

  <div class="tool-card">
    <h2>03 // GAYA NEWTON (FISIKA)</h2>
    <div class="input-group"><label>Massa (m) [kg]</label><input type="number" id="f-m"></div>
    <div class="input-group"><label>Percepatan (a) [m/s²]</label><input type="number" id="f-a"></div>
    <button class="hitung" onclick="hitungF()">HITUNG</button>
    <div class="hasil" id="out-f">> Standby...</div>
  </div>
</div>

<script>
  // ⚠️ PASTE API KEY LU DI ANTARA TANDA KUTIP DI BAWAH INI ⚠️
  const GEMINI_API_KEY = "";
  
  async function tanyaAI(event) {
    const file = event.target.files[0];
    if (!file) return;
    const output = document.getElementById('aiOutput');
    output.style.display = 'block';
    output.classList.remove('error');
    output.innerHTML = "⏳ AI sedang membaca dan menghitung... (mohon tunggu 5-10 detik)";

    try {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = async () => {
        const base64Data = reader.result.split(',')[1];
        const mimeType = file.type;
        const payload = {
          contents: [{
            parts: [
              { text: "Kamu adalah guru fisika. Baca soal di gambar ini, lalu berikan jawaban yang benar beserta rumus dan langkah-langkah pengerjaannya secara singkat dan jelas." },
              { inline_data: { mime_type: mimeType, data: base64Data } }
            ]
          }]
        };
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash-latest:generateContent`, {
  method: 'POST',
  headers: { 
    'Content-Type': 'application/json',
    'x-goog-api-key': GEMINI_API_KEY
  },
  body: JSON.stringify(payload)
});
        });
        const data = await response.json();
        if (data.error) {
          output.classList.add('error');
          output.innerHTML = "❌ Error API: " + data.error.message;
        } else {
          output.innerHTML = "🤖 <b>Jawaban AI:</b><br><br>" + data.candidates[0].content.parts[0].text;
        }
      };
    } catch (err) {
      output.classList.add('error');
      output.innerHTML = "❌ Gagal memproses gambar.";
    }
  }

  function val(id) { const x = parseFloat(document.getElementById(id).value); return isNaN(x) ? null : x; }
  function show(id, text, isErr = false) {
    const el = document.getElementById(id);
    el.innerHTML = "> " + text;
    el.className = isErr ? "hasil error" : "hasil";
  }
  function hitungV() {
    let s = val('v-s'), t = val('v-t');
    if(s===null || t===null || t===0) return show('out-v', 'INVALID (t≠0)!', true);
    show('out-v', `v = ${(s/t).toFixed(2)} m/s`);
  }
  function hitungF() {
    let m = val('f-m'), a = val('f-a');
    if(m===null || a===null) return show('out-f', 'INVALID INPUT!', true);
    show('out-f', `F = ${(m*a).toFixed(2)} Newton`);
  }
</script>
</body>
</html>
